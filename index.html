<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>نسخ الأسماء</title>
<style>body{font-family:system-ui;padding:20px;background:#f5f5f5} .row{background:#fff;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center} button{background:#1a6aa8;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer}</style>
</head>
<body>
<h3>أسماء الصور - اضغط نسخ</h3>
<div id="list"></div>
<script>
const files=["icon_shorta_nobeard.png","icon_jaych_nobeard.png","icon_woulat_nobeard.png","icon_aawan_nobeard.png","taalima.jpg","tahar.jpg"];
const list=document.getElementById('list');
files.forEach(f=>{
  const div=document.createElement('div');div.className='row';
  div.innerHTML=`<span>${f}</span><button onclick="navigator.clipboard.writeText('${f}');this.textContent='تم النسخ ✓'">نسخ</button>`;
  list.appendChild(div);
});
</script>
</body>
</html>
